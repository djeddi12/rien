name: Storefront checks
on:
  push:
    branches: [main, "feat/affiliate-autopilot-store"]
  pull_request:
    branches: [main, "feat/affiliate-autopilot-store"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m py_compile engine/server.py tests/test_server.py
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/admin.js
